name: CD

on:
  push:
    branches: [main]
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  test-build-and-publish:
    name: Build, Publish to GHCR & Smoke Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Enable Node SQLite (Node 22)
        run: echo "NODE_OPTIONS=--experimental-sqlite" >> "$GITHUB_ENV"

      - name: Install root dependencies
        run: npm ci

      - name: Install server dependencies
        run: npm ci
        working-directory: server

      - name: Run unit tests (frontend)
        run: npm run test:front

      - name: Run integration tests (API)
        run: npm run test:api

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata (API)
        id: meta-api
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}/api
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,format=short,prefix=sha-
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}

      - name: Build and push API image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: server/Dockerfile
          push: true
          tags: ${{ steps.meta-api.outputs.tags }}
          labels: ${{ steps.meta-api.outputs.labels }}
          build-args: |
            APP_VERSION=${{ steps.meta-api.outputs.version || '1.0.0' }}
            COMMIT_SHA=${{ github.sha }}

      - name: Extract Docker metadata (Web)
        id: meta-web
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}/web
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,format=short,prefix=sha-
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}

      - name: Build and push Web image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile
          push: true
          tags: ${{ steps.meta-web.outputs.tags }}
          labels: ${{ steps.meta-web.outputs.labels }}

      - name: Smoke Test (Verify published API image & /health)
        run: |
          IMAGE_NAME=$(echo "ghcr.io/${{ github.repository }}/api" | tr '[:upper:]' '[:lower:]')
          SHORT_SHA=$(git rev-parse --short HEAD)
          IMAGE_TAG="${IMAGE_NAME}:sha-${SHORT_SHA}"
          echo "Testando imagem: ${IMAGE_TAG}"

          docker run -d --name smoke-test-api -p 3001:3001 \
            -e NODE_ENV=production \
            -e PORT=3001 \
            -e DATABASE_PATH=/data/app.db \
            -e SEED_DIR=/app/seed \
            "${IMAGE_TAG}"

          echo "Aguardando inicializacao e checando /health..."
          SUCCESS=0
          for i in {1..15}; do
            RESPONSE=$(curl -s http://127.0.0.1:3001/health || true)
            echo "Tentativa $i: $RESPONSE"
            if echo "$RESPONSE" | grep -q '"status":"ok"'; then
              echo "Smoke test aprovado! /health respondeu com sucesso."
              SUCCESS=1
              break
            fi
            sleep 2
          done

          docker logs smoke-test-api
          docker rm -f smoke-test-api

          if [ $SUCCESS -ne 1 ]; then
            echo "Smoke test falhou: /health nao respondeu com status ok no tempo limite."
            exit 1
          fi
