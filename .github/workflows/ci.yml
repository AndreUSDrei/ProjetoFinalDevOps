name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Enable Node SQLite (Node 22)
        run: echo "NODE_OPTIONS=--experimental-sqlite" >> "$GITHUB_ENV"

      - name: Install frontend dependencies
        run: npm ci

      - name: Install API dependencies
        run: npm ci
        working-directory: server

      - name: Frontend unit tests
        run: npm run test:front

      - name: API integration tests
        run: npm run test:api

      - name: Build frontend
        run: npm run build

      - name: Docker Compose end-to-end smoke test
        run: |
          docker compose up --build --detach
          for attempt in {1..30}; do
            if curl --fail --silent http://localhost:8080/health > /tmp/health.json; then
              break
            fi
            sleep 2
          done
          node --input-type=module -e 'const health = await (await fetch("http://localhost:8080/health")).json(); if (health.status !== "ok" || health.database !== "up") { console.error(health); process.exit(1); }'
          curl --fail --silent http://localhost:8080/ > /dev/null
          curl --fail --silent http://localhost:8080/api/players > /dev/null
          curl --fail --silent http://localhost:8080/api/organizations > /dev/null

      - name: Stop Docker Compose services
        if: always()
        run: docker compose down --volumes

  publish-images:
    name: publish-images
    runs-on: ubuntu-latest
    needs: test-and-build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Prepare lowercase image prefix
        id: image-prefix
        run: echo "value=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker image metadata (web)
        id: meta-web
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.image-prefix.outputs.value }}/web
          tags: |
            type=raw,value=latest
            type=sha,prefix=

      - name: Build and publish web image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta-web.outputs.tags }}
          labels: ${{ steps.meta-web.outputs.labels }}

      - name: Docker image metadata (api)
        id: meta-api
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.image-prefix.outputs.value }}/api
          tags: |
            type=raw,value=latest
            type=sha,prefix=

      - name: Build and publish API image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./server/Dockerfile
          push: true
          tags: ${{ steps.meta-api.outputs.tags }}
          labels: ${{ steps.meta-api.outputs.labels }}
